<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multilingual Listing Studio</title><style>body{font:16px system-ui;background:#f6f2eb;color:#182923;margin:0}.wrap{max-width:1050px;margin:auto;padding:40px 22px}h1{font-size:clamp(34px,5vw,60px);margin:7px 0}.muted{color:#667a70}.grid{display:grid;grid-template-columns:350px 1fr;gap:22px}.card{background:white;border:1px solid #ddd9ce;border-radius:18px;padding:22px}label{display:block;margin:13px 0;font-weight:700;font-size:14px}input,select,textarea{display:block;box-sizing:border-box;width:100%;padding:10px;margin-top:5px;border:1px solid #b9c4bb;border-radius:8px;font:inherit}button{background:#155d49;color:white;border:0;border-radius:8px;padding:13px 18px;font-weight:bold;cursor:pointer}.copy{border-bottom:1px solid #ddd;padding:14px 0;white-space:pre-wrap}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><div class="wrap"><small>AITACLAB / REAL ESTATE DEMO 02</small><h1>One property brief. Three languages.</h1><p class="muted">Generate English, Arabic and Russian listing drafts from structured facts. Review before publishing.</p><div class="grid"><form class="card" id="form"><h2>Property facts</h2><label>Area<input name="area" value="Dubai Marina" required></label><label>Type<select name="type"><option>apartment</option><option>villa</option><option>townhouse</option><option>studio</option></select></label><label>Size (sq ft)<input name="size" type="number" min="1" value="1250" required></label><label>Bedrooms<input name="beds" type="number" min="0" value="2" required></label><label>Asking price AED<input name="price" type="number" min="1" value="2300000" required></label><label>Verified amenities<textarea name="amenities">balcony, parking, gym</textarea></label><button>Generate descriptions</button></form><div class="card"><h2>Draft listings</h2><p id="mode" class="muted">Ready</p><div id="result">Enter facts and generate copy.</div></div></div></div><script type="module">import{validate,template}from'./listings.mjs';document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const result=document.querySelector('#result');result.textContent='Generating…';try{const d={mode:'template',copy:template(validate(Object.fromEntries(new FormData(e.target))))};document.querySelector('#mode').textContent=d.mode==='ai'?'AI draft':'Template draft';result.replaceChildren();for(const [lang,title] of [['en','English'],['ar','العربية'],['ru','Русский']]){const section=document.createElement('section'),h=document.createElement('h3'),p=document.createElement('p');section.className='copy';h.textContent=title;p.textContent=d.copy[lang];if(lang==='ar')p.dir='rtl';section.append(h,p);result.append(section)}}catch(error){result.textContent=error.message}};</script></html>
